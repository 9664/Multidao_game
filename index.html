<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Multidão — Cerco Medieval 3D</title><style>html,body{margin:0;overflow:hidden;background:#142238;color:white;font:700 16px system-ui;touch-action:none}#hud{position:fixed;top:16px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}#hud span{background:#13223bdc;padding:9px;border-radius:10px}#panel{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#142238dd;padding:25px}button{background:#f2b53f;border:0;border-radius:14px;padding:17px;font-weight:900;font-size:20px}p{max-width:330px;line-height:1.5}</style></head><body><div id="hud"><span id="level">FASE 1</span><span id="army">EXÉRCITO 0</span><span id="foes">INIMIGOS 0</span></div><div id="panel"><h1 id="title">⚔️ Cerco Medieval 3D</h1><p id="msg">Arraste o dedo para mover o canhão. Atravesse os portões e derrote a horda vermelha!</p><button id="start">COMEÇAR</button></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color(0xaebfca);const camera=new T.PerspectiveCamera(52,innerWidth/innerHeight,.1,200);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(r.domElement);scene.add(new T.HemisphereLight(0xffffff,0x67705c,2.5));const light=new T.DirectionalLight(0xffe7bd,2);light.position.set(-8,18,10);scene.add(light);
const material=c=>new T.MeshStandardMaterial({color:c});const stone=material(0x747b82),road=material(0xa5a098),grass=material(0x7b9977),blue=material(0x177ee5),red=material(0xc82c39),gold=material(0xf0b947),iron=material(0x344454),wood=material(0x68442e);
function box(w,h,d,m,x,y,z){let a=new T.Mesh(new T.BoxGeometry(w,h,d),m);a.position.set(x,y,z);scene.add(a);return a}box(60,.1,200,grass,0,-.25,-55);box(10,.05,180,road,0,-.12,-50);for(let x of [-5.3,5.3]){box(.65,1.4,180,stone,x,.65,-50);for(let z=-130;z<35;z+=2.4)box(.7,.45,1,stone,x,1.55,z)}
const cannon=new T.Group();scene.add(cannon);function piece(geo,m,x,y,z,parent=cannon){const o=new T.Mesh(geo,m);o.position.set(x,y,z);parent.add(o);return o}piece(new T.BoxGeometry(1.6,.6,2),wood,0,.55,0);for(let x of [-.9,.9]){const o=piece(new T.CylinderGeometry(.5,.5,.25,12),iron,x,.55,.1);o.rotation.z=Math.PI/2}const barrel=piece(new T.CylinderGeometry(.3,.4,2,12),iron,0,1,-.5);barrel.rotation.x=Math.PI/2;
function label(n){const c=document.createElement('canvas');c.width=256;c.height=128;let a=c.getContext('2d');a.fillStyle='#177be2';a.fillRect(0,0,256,128);a.strokeStyle='#ffe06c';a.lineWidth=10;a.strokeRect(5,5,246,118);a.font='bold 82px sans-serif';a.textAlign='center';a.textBaseline='middle';a.fillStyle='white';a.fillText('×'+n,128,65);return new T.MeshBasicMaterial({map:new T.CanvasTexture(c),side:T.DoubleSide})}
let level=1,playing=false,dist=0,gunX=0,spawn=0,army=[],foes=[],gates=[],walls=[],battle=false,last=0;
function soldier(enemy,x,z){const m=enemy?red:blue;const g=new T.Group();piece(new T.CylinderGeometry(.17,.2,.65,6),m,0,.5,0,g);piece(new T.SphereGeometry(.2,7,6),gold,0,.96,0,g);piece(new T.ConeGeometry(.25,.32,6),m,0,1.2,0,g);g.position.set(x,0,z);scene.add(g);return {g,x,z}}
function kill(a){scene.remove(a.g)}function gate(z,x,n){let p=box(3,.95,.2,label(n),x,2.4,z);let l=box(.3,3,.4,gold,x-1.6,1.5,z),rr=box(.3,3,.4,gold,x+1.6,1.5,z);gates.push({z,x,n,parts:[p,l,rr],done:false})}function wall(z,x,w){walls.push({z,x,w,mesh:box(w,1.3,.8,stone,x,.65,z),done:false})}
function hud(){document.querySelector('#army').textContent='EXÉRCITO '+army.length;document.querySelector('#foes').textContent='INIMIGOS '+(battle?foes.length:40+level*15)}
function end(win){playing=false;document.querySelector('#panel').style.display='grid';document.querySelector('#title').textContent=win?'🏆 Vitória!':'🛡️ Derrota!';document.querySelector('#msg').textContent=win?'Você venceu o cerco!':'Tente atravessar mais portões e desviar dos muros.';document.querySelector('#start').textContent=win?'PRÓXIMA FASE':'TENTAR NOVAMENTE';if(win)level++}
function start(){for(const a of [...army,...foes])kill(a);for(const g of gates)g.parts.forEach(p=>scene.remove(p));for(const w of walls)scene.remove(w.mesh);army=[];foes=[];gates=[];walls=[];dist=0;gunX=0;spawn=0;battle=false;playing=true;gate(-14,-1.6,20);gate(-31,1.6,8);gate(-49,-1.6,5);gate(-68,1.6,3);wall(-23,1.8,3);wall(-40,-1.8,3);wall(-59,0,2);document.querySelector('#panel').style.display='none';document.querySelector('#level').textContent='FASE '+level;hud()}document.querySelector('#start').onclick=start;
function tick(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(playing){dist+=dt*5.4;cannon.position.set(gunX,0,-dist);spawn+=dt;while(spawn>.13&&!battle&&army.length<240){spawn-=.13;army.push(soldier(false,gunX+(Math.random()-.5)*.5,-dist-1.5))}for(const a of army){a.z-=dt*5.8;a.g.position.z=a.z;a.g.position.y=Math.sin(t*.009+a.x)*.04}for(const g of gates)if(!g.done&&dist> -g.z){g.done=true;const selected=army.filter(a=>Math.abs(a.z-g.z)<6&&Math.abs(a.x-g.x)<2);let n=Math.min(240-army.length,selected.length*(g.n-1));for(let i=0;i<n;i++){const a=selected[i%selected.length];army.push(soldier(false,Math.max(-4.5,Math.min(4.5,a.x+(Math.random()-.5)*2.5)),g.z-Math.random()*3))}g.parts.forEach(p=>p.visible=false)}for(const w of walls)if(!w.done&&dist> -w.z+1){w.done=true;army=army.filter(a=>{if(Math.abs(a.z-w.z)<8&&Math.abs(a.x-w.x)<w.w/2+.2){kill(a);return false}return true});w.mesh.visible=false}if(dist>74&&!battle){battle=true;for(let i=0;i<40+level*15;i++)foes.push(soldier(true,(Math.random()-.5)*8,-83-Math.random()*10))}if(battle){for(const e of foes){e.z+=dt*3;e.g.position.z=e.z}let n=Math.min(army.length,foes.length,Math.floor(dt*48));for(let i=0;i<n;i++){kill(army.pop());kill(foes.pop())}if(!foes.length)end(army.length>0);else if(!army.length)end(false)}if(dist>110&&playing)end(army.length>foes.length);hud()}let portrait=innerWidth/innerHeight<.7;camera.position.set(gunX*.3,portrait?18:14,-dist+(portrait?23:18));camera.lookAt(0,0,-dist-12);r.render(scene,camera);requestAnimationFrame(tick)}requestAnimationFrame(tick);
function move(e){if(playing)gunX=Math.max(-4.2,Math.min(4.2,(e.clientX/innerWidth-.5)*9.4))}r.domElement.addEventListener('pointerdown',e=>{r.domElement.setPointerCapture(e.pointerId);move(e)});r.domElement.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></body></html>
